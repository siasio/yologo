# Board Detector Configuration (Segmentation-based)
model:
  type: segmentation  # segmentation architecture
  pretrained: true
  input_size: 640
  mask_size: 160  # Output mask resolution (will be upsampled to input_size for loss)

training:
  epochs: 100
  batch_size: 16  # Reduced due to mask processing
  accumulation_steps: 2  # Effective batch size: 32
  
  optimizer:
    type: AdamW
    lr: 0.0005
    weight_decay: 0.0001
    betas: [0.9, 0.999]
  
  scheduler:
    type: CosineAnnealingLR
    T_max: 100
    eta_min: 0.00001
  
  loss:
    type: segmentation
    bce_weight: 0.5  # Binary cross-entropy weight
    dice_weight: 0.5  # Dice loss weight
    smooth: 1.0  # Smoothing factor for Dice loss
  
  # Gradient clipping
  grad_clip: 1.0
  
  # Early stopping
  early_stopping:
    patience: 15
    monitor: val_loss
    mode: min
  
  # Checkpointing
  checkpoint:
    save_top_k: 3
    monitor: val_loss
    mode: min
    save_last: true

validation:
  frequency: 1  # Validate every N epochs
  batch_size: 32

data:
  use_grid_corners: false  # Use grid corners (true) or board corners (false) for mask
